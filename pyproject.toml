[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-purchase-kaggle"
version = "0.1.0"
description = "Leakage-aware tabular ML pipeline for Kaggle Playground S6E9"
readme = "PROJECT.rst"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "wai871077-Liu"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
